name: CI

# Public-safe: GitHub-hosted runners only, read-only token, no secrets.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -q -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q --ignore=tests/live_intents.py

      - name: Scenario simulator
        run: python tests/simulate.py

      - name: Compile check
        run: python -m compileall -q -x '/(\.venv|venv|data|\.git)/' .

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            git /repo --no-banner --redact
