name: Feature request
description: Suggest something new for the bot
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What your club is trying to do
      description: The problem, not the solution. How do you handle it today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like the bot to do
  - type: markdown
    attributes:
      value: Check [docs/known-gaps.md](../blob/master/docs/known-gaps.md) first. Some items are planned, and some are listed as out of scope.
